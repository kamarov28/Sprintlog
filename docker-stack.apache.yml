version: "3.8"

services:
  web:
    image: your-dockerhub/sprintlog-apache:1.0
    ports:
      - "80:80"
    environment:
      APP_NAME: SprintLog
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://sprintlog.local}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Jakarta}
      TZ: ${TZ:-Asia/Jakarta}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: sprintlog
      DB_USERNAME: sprintlog
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
      SESSION_SAME_SITE: ${SESSION_SAME_SITE:-lax}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      MAIL_MAILER: smtp
      MAIL_HOST: ${MAIL_HOST:-mail.sprintlog.local}
      MAIL_PORT: ${MAIL_PORT:-25}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@sprintlog.local}
      MAIL_FROM_NAME: SprintLog
      RAJAONGKIR_SHIPPING_ENABLED: ${RAJAONGKIR_SHIPPING_ENABLED:-false}
      RAJAONGKIR_SHIPPING_API_KEY: ${RAJAONGKIR_SHIPPING_API_KEY:-}
      RAJAONGKIR_SHIPPING_BASE_URL: ${RAJAONGKIR_SHIPPING_BASE_URL:-https://rajaongkir.komerce.id/api/v1}
      RAJAONGKIR_SHIPPING_TIMEOUT: ${RAJAONGKIR_SHIPPING_TIMEOUT:-10}
      RAJAONGKIR_SHIPPING_CACHE_TTL: ${RAJAONGKIR_SHIPPING_CACHE_TTL:-86400}
      RAJAONGKIR_SHIPPING_COURIERS: ${RAJAONGKIR_SHIPPING_COURIERS:-jne:jnt:sicepat:pos}
      RAJAONGKIR_SHIPPING_PRICE_MODE: ${RAJAONGKIR_SHIPPING_PRICE_MODE:-lowest}
      ROUTING_OSRM_ENABLED: ${ROUTING_OSRM_ENABLED:-true}
      ROUTING_OSRM_BASE_URL: ${ROUTING_OSRM_BASE_URL:-https://router.project-osrm.org}
      ROUTING_TIMEOUT: ${ROUTING_TIMEOUT:-4}
      ROUTING_CACHE_TTL: ${ROUTING_CACHE_TTL:-86400}
      ROUTING_FALLBACK_ROAD_FACTOR: ${ROUTING_FALLBACK_ROAD_FACTOR:-1.28}
      ROUTING_FALLBACK_SPEED_KMH: ${ROUTING_FALLBACK_SPEED_KMH:-42}
    networks:
      - sprintlog
    volumes:
      - sprintlog_storage:/var/www/html/storage
    deploy:
      replicas: 1

  worker:
    image: your-dockerhub/sprintlog-apache:1.0
    command: php artisan queue:work database --sleep=3 --tries=3 --max-time=3600
    environment:
      APP_NAME: SprintLog
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://sprintlog.local}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Jakarta}
      TZ: ${TZ:-Asia/Jakarta}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: sprintlog
      DB_USERNAME: sprintlog
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
      SESSION_SAME_SITE: ${SESSION_SAME_SITE:-lax}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      MAIL_MAILER: smtp
      MAIL_HOST: ${MAIL_HOST:-mail.sprintlog.local}
      MAIL_PORT: ${MAIL_PORT:-25}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@sprintlog.local}
      MAIL_FROM_NAME: SprintLog
      RAJAONGKIR_SHIPPING_ENABLED: ${RAJAONGKIR_SHIPPING_ENABLED:-false}
      RAJAONGKIR_SHIPPING_API_KEY: ${RAJAONGKIR_SHIPPING_API_KEY:-}
      RAJAONGKIR_SHIPPING_BASE_URL: ${RAJAONGKIR_SHIPPING_BASE_URL:-https://rajaongkir.komerce.id/api/v1}
      RAJAONGKIR_SHIPPING_TIMEOUT: ${RAJAONGKIR_SHIPPING_TIMEOUT:-10}
      RAJAONGKIR_SHIPPING_CACHE_TTL: ${RAJAONGKIR_SHIPPING_CACHE_TTL:-86400}
      RAJAONGKIR_SHIPPING_COURIERS: ${RAJAONGKIR_SHIPPING_COURIERS:-jne:jnt:sicepat:pos}
      RAJAONGKIR_SHIPPING_PRICE_MODE: ${RAJAONGKIR_SHIPPING_PRICE_MODE:-lowest}
      ROUTING_OSRM_ENABLED: ${ROUTING_OSRM_ENABLED:-true}
      ROUTING_OSRM_BASE_URL: ${ROUTING_OSRM_BASE_URL:-https://router.project-osrm.org}
      ROUTING_TIMEOUT: ${ROUTING_TIMEOUT:-4}
      ROUTING_CACHE_TTL: ${ROUTING_CACHE_TTL:-86400}
      ROUTING_FALLBACK_ROAD_FACTOR: ${ROUTING_FALLBACK_ROAD_FACTOR:-1.28}
      ROUTING_FALLBACK_SPEED_KMH: ${ROUTING_FALLBACK_SPEED_KMH:-42}
    networks:
      - sprintlog
    volumes:
      - sprintlog_storage:/var/www/html/storage
    deploy:
      replicas: 1

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: sprintlog
      MYSQL_USER: sprintlog
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    networks:
      - sprintlog
    volumes:
      - sprintlog_db:/var/lib/mysql
    deploy:
      placement:
        constraints:
          - node.hostname == sprintlog-data

networks:
  sprintlog:
    driver: overlay

volumes:
  sprintlog_db:
  sprintlog_storage:
