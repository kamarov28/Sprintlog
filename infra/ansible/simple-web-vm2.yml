---
- name: Deploy simple web container on VM2
  hosts: managed
  become: true

  tasks:
    - name: Install Docker
      ansible.builtin.apt:
        name: docker.io
        state: present
        update_cache: true

    - name: Start and enable Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Verify Docker version
      ansible.builtin.command: docker --version
      register: docker_version_result
      changed_when: false

    - name: Show Docker version
      ansible.builtin.debug:
        var: docker_version_result.stdout

    - name: Verify Docker service is usable
      ansible.builtin.command: docker info --format 'Docker server is running on {{ "{{.Name}}" }} with {{ "{{.ServerVersion}}" }}'
      register: docker_info_result
      changed_when: false

    - name: Show Docker service verification
      ansible.builtin.debug:
        var: docker_info_result.stdout

    - name: Remove old web containers if they exist
      ansible.builtin.shell: docker rm -f simple-web-vm2 sirhan-web 2>/dev/null || true
      changed_when: false

    - name: Create simple web directory
      ansible.builtin.file:
        path: /opt/simple-web-vm2
        state: directory
        mode: "0755"

    - name: Create simple web page
      ansible.builtin.copy:
        dest: /opt/simple-web-vm2/index.html
        content: |
          <!DOCTYPE html>
          <html>
          <head>
              <title>VM2 Docker Web</title>
          </head>
          <body>
              <h1>Berhasil Deploy Web Container ke VM2</h1>
              <p>Web sederhana ini berjalan menggunakan container Docker nginx.</p>
              <p>Deploy dilakukan menggunakan Ansible dari VM1.</p>
              <p>Akses web ini melalui port 90 di VM2.</p>
          </body>
          </html>
        mode: "0644"

    - name: Run simple web container on port 90
      ansible.builtin.command: >
        docker run -d
        --name simple-web-vm2
        --restart always
        -p 90:80
        -v /opt/simple-web-vm2:/usr/share/nginx/html:ro
        nginx:alpine

    - name: Check simple web container
      ansible.builtin.command: docker ps --filter name=simple-web-vm2 --format 'table {{ "{{.Names}}" }}\t{{ "{{.Image}}" }}\t{{ "{{.Status}}" }}\t{{ "{{.Ports}}" }}'
      register: container_result
      changed_when: false

    - name: Show simple web container
      ansible.builtin.debug:
        var: container_result.stdout_lines

    - name: Check simple web response on port 90
      ansible.builtin.command: curl -s localhost:90
      register: web_result
      changed_when: false

    - name: Show simple web response
      ansible.builtin.debug:
        var: web_result.stdout_lines
