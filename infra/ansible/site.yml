---
# SprintLog infrastructure playbook
#
# This playbook automates the whole two-VM lab deployment:
# base Linux setup, DNS/DHCP/mail support services, Docker, Swarm,
# local registry, Laravel image build, stack deployment, migration,
# seed accounts, and queue worker startup.
#
# Notes for defense/presentation:
# - If a play is removed, the components depending on that play may still work
#   only if they were configured manually beforehand.
# - The playbook is meant to be idempotent: it can be run again to repair or
#   re-apply configuration.

# Purpose: prepare both VMs with required base tools and local name fallback.
# If removed: later tasks may fail because tools like git, curl, Python, or SSH
# may be missing; local hostname fallback in /etc/hosts will also be unavailable.
- name: Prepare Ubuntu base packages on both VMs
  hosts: all
  become: true
  vars_files:
    - group_vars/all.yml
  tags:
    - base
  tasks:
    - name: Install base packages
      ansible.builtin.apt:
        name: "{{ base_packages }}"
        update_cache: true
        state: present

    - name: Ensure SSH service is enabled
      ansible.builtin.service:
        name: ssh
        enabled: true
        state: started

    - name: Add lab host records
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} SPRINTLOG LAB HOSTS"
        block: |
          {{ controller_ip }} {{ lab_domain }} www.{{ lab_domain }} admin.{{ lab_domain }} controller.{{ lab_domain }} vm1
          {{ managed_ip }} vm2 app2.{{ lab_domain }}

# Purpose: configure optional lab support services on VM1: DNS, DHCP, and mail.
# If removed: the web application can still run by IP, but lab domain lookup,
# automatic client IP/DNS distribution, and local mail testing will be unavailable.
- name: Install Ansible support services on VM 1 controller
  hosts: controller
  become: true
  vars_files:
    - group_vars/all.yml
  tags:
    - support
  tasks:
    - name: Install Ansible on controller
      ansible.builtin.apt:
        name:
          - ansible
        state: present
        update_cache: true
      tags:
        - ansible

    # DNS forward and reverse zones for local lab domains such as sprintlog.local.
    # If removed: clients cannot resolve sprintlog.local through Bind9.
    - name: Install DNS packages when enabled
      ansible.builtin.apt:
        name:
          - bind9
          - bind9utils
        state: present
      when: enable_dns | bool
      tags:
        - dns

    - name: Configure DNS zone
      ansible.builtin.template:
        src: templates/named.conf.local.j2
        dest: /etc/bind/named.conf.local
        mode: "0644"
      when: enable_dns | bool
      notify: Restart bind9
      tags:
        - dns

    - name: Configure SprintLog DNS records
      ansible.builtin.template:
        src: templates/db.sprintlog.local.j2
        dest: "{{ dns_zone_file }}"
        mode: "0644"
      when: enable_dns | bool
      notify: Restart bind9
      tags:
        - dns

    - name: Configure SprintLog reverse DNS records
      ansible.builtin.template:
        src: templates/db.reverse.j2
        dest: "{{ dns_reverse_zone_file }}"
        mode: "0644"
      when:
        - enable_dns | bool
        - dns_reverse_enabled | bool
      notify: Restart bind9
      tags:
        - dns

    - name: Validate Bind9 main configuration
      ansible.builtin.command: named-checkconf
      changed_when: false
      when: enable_dns | bool
      tags:
        - dns

    - name: Validate SprintLog forward DNS zone
      ansible.builtin.command: named-checkzone {{ lab_domain }} {{ dns_zone_file }}
      changed_when: false
      when: enable_dns | bool
      tags:
        - dns

    - name: Validate SprintLog reverse DNS zone
      ansible.builtin.command: named-checkzone {{ dns_reverse_zone }} {{ dns_reverse_zone_file }}
      changed_when: false
      when:
        - enable_dns | bool
        - dns_reverse_enabled | bool
      tags:
        - dns

    - name: Enable DNS service
      ansible.builtin.service:
        name: bind9
        enabled: true
        state: started
      when: enable_dns | bool
      tags:
        - dns

    # DHCP gives IP address, gateway, DNS server, and domain automatically.
    # If removed: clients must use manual IP/DNS settings or another DHCP server.
    - name: Install DHCP package when enabled
      ansible.builtin.apt:
        name: isc-dhcp-server
        state: present
      when: enable_dhcp | bool
      tags:
        - dhcp

    - name: Configure DHCP defaults
      ansible.builtin.template:
        src: templates/isc-dhcp-server.j2
        dest: /etc/default/isc-dhcp-server
        mode: "0644"
      when: enable_dhcp | bool
      notify: Restart isc-dhcp-server
      tags:
        - dhcp

    - name: Configure DHCP scope
      ansible.builtin.template:
        src: templates/dhcpd.conf.j2
        dest: /etc/dhcp/dhcpd.conf
        mode: "0644"
      when: enable_dhcp | bool
      notify: Restart isc-dhcp-server
      tags:
        - dhcp

    - name: Validate DHCP configuration
      ansible.builtin.command: dhcpd -t -cf /etc/dhcp/dhcpd.conf
      changed_when: false
      when: enable_dhcp | bool
      tags:
        - dhcp

    # Local mail server for lab testing using Postfix, Dovecot, and Mutt.
    # If removed: SprintLog can still run, but local SMTP/IMAP testing is unavailable.
    - name: Preseed Postfix as internet site when mail is enabled
      ansible.builtin.debconf:
        name: postfix
        question: "{{ item.question }}"
        value: "{{ item.value }}"
        vtype: "{{ item.vtype }}"
      loop:
        - question: postfix/mailname
          value: "{{ mail_domain }}"
          vtype: string
        - question: postfix/main_mailer_type
          value: Internet Site
          vtype: select
      when: enable_mail | bool
      tags:
        - mail

    - name: Install mail server packages when enabled
      ansible.builtin.apt:
        name:
          - postfix
          - mailutils
          - dovecot-core
          - dovecot-imapd
          - mutt
        state: present
      environment:
        DEBIAN_FRONTEND: noninteractive
      when: enable_mail | bool
      tags:
        - mail

    - name: Configure mailname
      ansible.builtin.template:
        src: templates/mailname.j2
        dest: /etc/mailname
        mode: "0644"
      when: enable_mail | bool
      notify: Restart postfix
      tags:
        - mail

    - name: Configure Postfix main.cf for lab mail
      ansible.builtin.template:
        src: templates/postfix-main.cf.j2
        dest: /etc/postfix/main.cf
        mode: "0644"
      when: enable_mail | bool
      notify: Restart postfix
      tags:
        - mail

    - name: Configure Dovecot Maildir storage
      ansible.builtin.lineinfile:
        path: /etc/dovecot/conf.d/10-mail.conf
        regexp: '^mail_location\s*='
        line: 'mail_location = maildir:~/Maildir'
        create: false
      when: enable_mail | bool
      notify: Restart dovecot
      tags:
        - mail

    - name: Enable Dovecot IMAP protocol
      ansible.builtin.lineinfile:
        path: /etc/dovecot/dovecot.conf
        regexp: '^protocols\s*='
        line: 'protocols = imap'
        insertafter: EOF
      when: enable_mail | bool
      notify: Restart dovecot
      tags:
        - mail

    - name: Configure default Mutt profile for new users
      ansible.builtin.template:
        src: templates/muttrc.j2
        dest: /etc/skel/.muttrc
        mode: "0644"
      when: enable_mail | bool
      tags:
        - mail

    - name: Create lab mail users
      ansible.builtin.user:
        name: "{{ item.name }}"
        shell: /bin/bash
        create_home: true
        state: present
      loop: "{{ mail_test_users }}"
      when: enable_mail | bool
      tags:
        - mail

    - name: Set lab mail user passwords
      ansible.builtin.shell: "echo '{{ item.name }}:{{ item.password }}' | chpasswd"
      loop: "{{ mail_test_users }}"
      no_log: true
      when: enable_mail | bool
      tags:
        - mail

    - name: Create Maildir folders for lab mail users
      ansible.builtin.file:
        path: "/home/{{ item.0.name }}/Maildir/{{ item.1 }}"
        state: directory
        owner: "{{ item.0.name }}"
        group: "{{ item.0.name }}"
        mode: "0700"
      loop: "{{ mail_test_users | product(['cur', 'new', 'tmp', 'Sent', 'Drafts']) | list }}"
      when: enable_mail | bool
      tags:
        - mail

    - name: Configure Mutt profile for lab mail users
      ansible.builtin.template:
        src: templates/muttrc.j2
        dest: "/home/{{ item.name }}/.muttrc"
        owner: "{{ item.name }}"
        group: "{{ item.name }}"
        mode: "0644"
      loop: "{{ mail_test_users }}"
      when: enable_mail | bool
      tags:
        - mail

    - name: Enable mail server service
      ansible.builtin.service:
        name: postfix
        enabled: true
        state: started
      when: enable_mail | bool
      tags:
        - mail

    - name: Enable Dovecot service
      ansible.builtin.service:
        name: dovecot
        enabled: true
        state: started
      when: enable_mail | bool
      tags:
        - mail

    - name: Send optional test mail from user2 to user1
      ansible.builtin.shell: |
        echo "Halo, email ini dikirim dari user2" | mail -s "Uji Coba" user1
      become_user: user2
      when:
        - enable_mail | bool
        - mail_send_test_message | bool
      tags:
        - mail

  handlers:
    - name: Restart bind9
      ansible.builtin.service:
        name: bind9
        state: restarted

    - name: Restart isc-dhcp-server
      ansible.builtin.service:
        name: isc-dhcp-server
        state: restarted

    - name: Restart postfix
      ansible.builtin.service:
        name: postfix
        state: restarted

    - name: Restart dovecot
      ansible.builtin.service:
        name: dovecot
        state: restarted

# Purpose: install Docker on both VMs and configure the local insecure registry.
# If removed: Docker Swarm and all containerized services cannot run.
- name: Install Docker on both VMs
  hosts: docker_hosts
  become: true
  vars_files:
    - group_vars/all.yml
  tags:
    - docker
  tasks:
    - name: Ensure Docker config directory exists
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        mode: "0755"

    - name: Configure Docker daemon for VM 1 local registry
      ansible.builtin.template:
        src: templates/docker-daemon.json.j2
        dest: /etc/docker/daemon.json
        mode: "0644"
      notify: Restart docker

    - name: Install Docker engine packages
      ansible.builtin.apt:
        name: "{{ docker_engine_packages }}"
        update_cache: true
        state: present

    - name: Try installing Docker Compose v2 plugin
      ansible.builtin.apt:
        name: "{{ docker_compose_v2_package }}"
        state: present
      register: docker_compose_v2_result
      ignore_errors: true

    - name: Install legacy Docker Compose when v2 package is unavailable
      ansible.builtin.apt:
        name: "{{ docker_compose_fallback_package }}"
        state: present
      when: docker_compose_v2_result is failed

    - name: Enable Docker
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started

    - name: Add SSH user to docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true
      when: ansible_user is defined

  handlers:
    - name: Restart docker
      ansible.builtin.service:
        name: docker
        state: restarted

# Purpose: turn VM1 into the Swarm manager and create the local image registry.
# If removed: docker stack deploy cannot run and VM2 cannot pull the local image.
- name: Initialize Docker Swarm on VM 1
  hosts: swarm_manager
  become: true
  vars_files:
    - group_vars/all.yml
  tags:
    - swarm
    - registry
  tasks:
    - name: Check current Swarm state
      ansible.builtin.command: docker info --format '{{ "{{.Swarm.LocalNodeState}}" }}'
      register: swarm_state
      changed_when: false

    - name: Initialize Swarm manager
      ansible.builtin.command: docker swarm init --advertise-addr {{ swarm_advertise_addr }}
      when: swarm_state.stdout != "active"

    - name: Read Swarm worker join token
      ansible.builtin.command: docker swarm join-token -q worker
      register: worker_join_token
      changed_when: false

    - name: Check local Docker registry container
      ansible.builtin.command: docker inspect -f '{{ "{{.State.Running}}" }}' {{ docker_registry_container_name }}
      register: registry_state
      failed_when: false
      changed_when: false

    - name: Start existing local Docker registry container
      ansible.builtin.command: docker start {{ docker_registry_container_name }}
      when:
        - registry_state.rc == 0
        - registry_state.stdout != "true"

    - name: Create local Docker registry on VM 1
      ansible.builtin.command: >
        docker run -d
        --restart=always
        -p 5000:5000
        -v sprintlog_registry:/var/lib/registry
        --name {{ docker_registry_container_name }}
        registry:2
      when: registry_state.rc != 0

    - name: Wait until local registry responds
      ansible.builtin.uri:
        url: "http://{{ docker_registry_host }}/v2/"
        status_code: 200
      register: registry_health
      retries: 10
      delay: 3
      until: registry_health.status == 200

# Purpose: join VM2 into the Swarm cluster as worker.
# If removed: the application can still run on VM1, but there is no two-node
# deployment and no app replica on VM2.
- name: Join VM 2 as Docker Swarm worker
  hosts: swarm_workers
  become: true
  vars_files:
    - group_vars/all.yml
  tags:
    - swarm
  tasks:
    - name: Check current Swarm state
      ansible.builtin.command: docker info --format '{{ "{{.Swarm.LocalNodeState}}" }}'
      register: worker_swarm_state
      changed_when: false

    - name: Join worker to Swarm
      ansible.builtin.command: >
        docker swarm join
        --token {{ hostvars[groups['swarm_manager'][0]].worker_join_token.stdout }}
        {{ controller_ip }}:2377
      when: worker_swarm_state.stdout != "active"

# Purpose: build and deploy SprintLog through Docker Swarm.
# If removed: infrastructure services may exist, but the Laravel app, MySQL,
# Nginx load balancer, migration, seed accounts, and worker will not be deployed.
- name: Deploy SprintLog stack from VM 1
  hosts: swarm_manager
  become: true
  vars_files:
    - group_vars/all.yml
  tags:
    - deploy
  tasks:
    - name: Clone or update SprintLog repository from VCS
      ansible.builtin.git:
        repo: "{{ app_repo_url }}"
        dest: "{{ app_deploy_path }}"
        version: "{{ app_repo_version }}"
        update: "{{ app_repo_update | default(true) | bool }}"

    - name: Build SprintLog Apache image from cloned repository
      ansible.builtin.command: docker build --network=host -t {{ sprintlog_image }} -f Dockerfile.apache .
      args:
        chdir: "{{ app_deploy_path }}"

    - name: Push SprintLog image to VM 1 local registry
      ansible.builtin.command: docker push {{ sprintlog_image }}

    - name: Decide whether APP_KEY must be generated
      ansible.builtin.set_fact:
        sprintlog_generate_app_key: "{{ (app_key | default('') | trim) == '' or 'CHANGE_THIS' in (app_key | default('')) }}"

    - name: Generate Laravel APP_KEY automatically for lab deployment
      ansible.builtin.command: docker run --rm --entrypoint php {{ sprintlog_image }} artisan key:generate --show
      register: generated_app_key
      changed_when: sprintlog_generate_app_key | bool
      when: sprintlog_generate_app_key | bool

    - name: Set runtime Laravel APP_KEY
      ansible.builtin.set_fact:
        sprintlog_runtime_app_key: "{{ generated_app_key.stdout if (sprintlog_generate_app_key | bool) else app_key }}"

    # Self-signed HTTPS certificate for lab/demo.
    # If removed: HTTP still works, but HTTPS on port 443 will fail because Nginx has no certificate.
    - name: Ensure SprintLog TLS certificate directory exists
      ansible.builtin.file:
        path: "{{ tls_cert_dir }}"
        state: directory
        mode: "0755"

    - name: Check SprintLog TLS certificate
      ansible.builtin.stat:
        path: "{{ tls_cert_file }}"
      register: sprintlog_tls_cert

    - name: Generate self-signed SprintLog TLS certificate
      ansible.builtin.command: >
        openssl req -x509 -nodes -days 3650 -newkey rsa:2048
        -keyout {{ tls_key_file }}
        -out {{ tls_cert_file }}
        -subj "/CN={{ lab_domain }}"
        -addext "subjectAltName=DNS:{{ lab_domain }},DNS:www.{{ lab_domain }},DNS:admin.{{ lab_domain }},IP:{{ dns_forward_ip }},IP:{{ controller_ip }}"
      when: not sprintlog_tls_cert.stat.exists

    - name: Secure SprintLog TLS private key
      ansible.builtin.file:
        path: "{{ tls_key_file }}"
        mode: "0600"
      when: sprintlog_tls_cert.stat.exists or not sprintlog_tls_cert.stat.exists

    - name: Write stack environment file
      ansible.builtin.template:
        src: templates/stack.env.j2
        dest: "{{ app_deploy_path }}/infra/docker/.env"
        mode: "0600"

    - name: Deploy Docker stack
      ansible.builtin.shell: |
        set -a
        . ./.env
        set +a
        docker stack deploy -c docker-stack.two-vm.yml {{ stack_name }}
      args:
        chdir: "{{ app_deploy_path }}/infra/docker"

    - name: Show SprintLog services
      ansible.builtin.command: docker stack services {{ stack_name }}
      register: stack_services
      changed_when: false

    - name: Print SprintLog services
      ansible.builtin.debug:
        var: stack_services.stdout_lines

    - name: Wait until database service has one replica
      ansible.builtin.command: docker service ls --filter name={{ stack_name }}_db --format '{{ "{{.Replicas}}" }}'
      register: db_replicas
      changed_when: false
      retries: 20
      delay: 6
      until: "'1/1' in db_replicas.stdout"

    - name: Wait until app service has two replicas
      ansible.builtin.command: docker service ls --filter name={{ stack_name }}_app --format '{{ "{{.Replicas}}" }}'
      register: app_replicas
      changed_when: false
      retries: 20
      delay: 6
      until: "'2/2' in app_replicas.stdout"

    - name: Check database restore file when enabled
      ansible.builtin.stat:
        path: "{{ database_restore_file }}"
      register: database_restore_stat
      when: database_restore_enabled | bool

    - name: Fail when database restore file is missing
      ansible.builtin.fail:
        msg: "Database restore file not found: {{ database_restore_file }}"
      when:
        - database_restore_enabled | bool
        - not database_restore_stat.stat.exists

    - name: Restore SQL dump into SprintLog database when enabled
      ansible.builtin.shell: |
        docker run --rm \
          --network {{ stack_name }}_sprintlog_net \
          --env-file ./.env \
          -v {{ database_restore_file }}:/restore.sql:ro \
          mysql:8.4 \
          sh -lc 'mysql -h db -u sprintlog -p"$DB_PASSWORD" sprintlog < /restore.sql'
      args:
        chdir: "{{ app_deploy_path }}/infra/docker"
      when: database_restore_enabled | bool

    # Migration creates DB tables; storage:link exposes public uploads;
    # optimize caches Laravel config/routes/views for production-like mode.
    # If removed: the app may start, but login/database features can fail.
    - name: Run Laravel migration, storage link, and optimize automatically
      ansible.builtin.shell: |
        docker run --rm \
          --network {{ stack_name }}_sprintlog_net \
          --env-file ./.env \
          -v {{ stack_name }}_sprintlog_storage:/var/www/html/storage \
          {{ sprintlog_image }} \
          sh -lc 'php artisan migrate --force && (php artisan storage:link || true) && php artisan optimize'
      args:
        chdir: "{{ app_deploy_path }}/infra/docker"
      register: laravel_bootstrap
      retries: 10
      delay: 15
      until: laravel_bootstrap.rc == 0

    - name: Print Laravel bootstrap output
      ansible.builtin.debug:
        var: laravel_bootstrap.stdout_lines

    - name: Seed deploy login accounts when enabled
      ansible.builtin.shell: |
        docker run --rm \
          --network {{ stack_name }}_sprintlog_net \
          --env-file ./.env \
          {{ sprintlog_image }} \
          php artisan db:seed --class=Database\\Seeders\\DeploymentAccountSeeder --force
      args:
        chdir: "{{ app_deploy_path }}/infra/docker"
      when: database_seed_mode == "accounts"

    - name: Seed full demo data when enabled
      ansible.builtin.shell: |
        docker run --rm \
          --network {{ stack_name }}_sprintlog_net \
          --env-file ./.env \
          {{ sprintlog_image }} \
          php artisan db:seed --force
      args:
        chdir: "{{ app_deploy_path }}/infra/docker"
      when: database_seed_mode == "demo"

    # Worker is started last so queue/cache tables already exist.
    # If started before migration, it can crash with missing cache/jobs tables.
    - name: Start Sprintlog worker after database bootstrap
      ansible.builtin.command: docker service scale {{ stack_name }}_worker=1
      changed_when: true
