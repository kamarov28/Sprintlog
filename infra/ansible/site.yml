---
- name: Deploy SprintLog Docker stack on VM1
  hosts: all
  become: true

  vars:
    controller_ip: 172.20.3.133
    app_repo_url: https://github.com/kamarov28/Sprintlog.git
    app_repo_version: main
    app_deploy_path: /home/ujikom/sprintlog
    docker_registry_port: 5000
    docker_registry_host: 172.20.3.133:5000
    docker_registry_container_name: sprintlog-registry
    docker_registry_volume_name: sprintlog_registry
    docker_registry_image: registry:2
    sprintlog_image: 172.20.3.133:5000/sprintlog-apache:latest
    stack_name: sprintlog
    swarm_manager_hostname: rajindra-sirhancontroller
    docker_network_name: network_ujikom
    docker_db_volume_name: db_ujikom
    docker_storage_volume_name: volume_ujikom
    app_url: http://172.20.3.133:8080
    app_timezone: Asia/Jakarta
    db_password: root
    db_root_password: root
    app_replicas: 3
    mysql_replicas: 1
    lb_replicas: 1
    database_seed_mode: demo

  tasks:
    - name: Install base packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - git
          - gnupg
          - lsb-release
          - openssh-server
          - python3
          - python3-apt
          - python3-pip
          - rsync
          - software-properties-common
          - unzip
          - openssl
          - docker.io
          - docker-compose-v2
        update_cache: true
        state: present

    - name: Enable SSH service
      ansible.builtin.service:
        name: ssh
        enabled: true
        state: started

    - name: Add VM1 host record
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} SPRINTLOG LAB HOSTS"
        block: |
          {{ controller_ip }} vm1

    - name: Create Docker config directory
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        mode: "0755"

    - name: Configure Docker daemon for local registry
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        mode: "0644"
        content: |
          {
            "insecure-registries": ["172.20.3.133:5000"]
          }
      notify: Restart docker

    - name: Enable Docker service
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started

    - name: Flush Docker restart handler
      ansible.builtin.meta: flush_handlers

    - name: Check current Swarm state
      ansible.builtin.command: docker info --format '{{ "{{.Swarm.LocalNodeState}}" }}'
      register: swarm_state
      changed_when: false

    - name: Initialize Docker Swarm manager
      ansible.builtin.command: docker swarm init --advertise-addr {{ controller_ip }}
      when: swarm_state.stdout != "active"

    - name: Check local Docker registry container
      ansible.builtin.command: docker inspect -f '{{ "{{.State.Running}}" }}' {{ docker_registry_container_name }}
      register: registry_state
      failed_when: false
      changed_when: false

    - name: Start existing local Docker registry container
      ansible.builtin.command: docker start {{ docker_registry_container_name }}
      when:
        - registry_state.rc == 0
        - registry_state.stdout != "true"

    - name: Create local Docker registry container
      ansible.builtin.command: >
        docker run -d --restart=always
        -p {{ docker_registry_port }}:5000
        -v {{ docker_registry_volume_name }}:/var/lib/registry
        --name {{ docker_registry_container_name }} {{ docker_registry_image }}
      when: registry_state.rc != 0

    - name: Wait until local registry responds
      ansible.builtin.uri:
        url: http://{{ docker_registry_host }}/v2/
        status_code: 200
      register: registry_health
      retries: 10
      delay: 3
      until: registry_health.status == 200

    - name: Clone or update SprintLog repository
      ansible.builtin.git:
        repo: "{{ app_repo_url }}"
        dest: "{{ app_deploy_path }}"
        version: "{{ app_repo_version }}"
        update: false

    - name: Build SprintLog custom Docker image
      ansible.builtin.command: docker build --network=host -t {{ sprintlog_image }} -f Dockerfile .
      args:
        chdir: "{{ app_deploy_path }}"

    - name: Push SprintLog image to local registry
      ansible.builtin.command: docker push {{ sprintlog_image }}

    - name: Generate Laravel APP_KEY
      ansible.builtin.shell: "printf 'base64:%s\n' \"$(openssl rand -base64 32)\""
      register: generated_app_key
      changed_when: true

    - name: Write stack environment file
      ansible.builtin.copy:
        dest: "{{ app_deploy_path }}/infra/docker/.env"
        mode: "0600"
        content: |
          APP_KEY={{ generated_app_key.stdout }}
          APP_URL={{ app_url }}
          APP_ENV=production
          APP_DEBUG=false
          APP_TIMEZONE={{ app_timezone }}
          TZ={{ app_timezone }}
          DB_CONNECTION=mysql
          DB_HOST=db
          DB_PORT=3306
          DB_DATABASE=sprintlog
          DB_USERNAME=sprintlog
          DB_PASSWORD={{ db_password }}
          DB_ROOT_PASSWORD={{ db_root_password }}
          CACHE_STORE=database
          SESSION_DRIVER=database
          QUEUE_CONNECTION=database
          SESSION_SECURE_COOKIE=false
          SESSION_SECURE=false
          SESSION_SAME_SITE=lax
          TRUSTED_PROXIES=*
          SPRINTLOG_IMAGE={{ sprintlog_image }}
          SWARM_MANAGER_HOSTNAME={{ swarm_manager_hostname }}
          NGINX_LB_IMAGE=nginx:1.27-alpine
          MYSQL_IMAGE=mysql:8.4
          HTTP_PORT=8080
          APP_REPLICAS={{ app_replicas }}
          LB_REPLICAS={{ lb_replicas }}
          MYSQL_REPLICAS={{ mysql_replicas }}
          DEPLOY_BRANCH_NAME="SprintLog Hub DKI Jakarta"
          DEPLOY_BRANCH_CITY="DKI Jakarta"
          DEPLOY_BRANCH_ADDRESS="Jl. Operasional SprintLog, DKI Jakarta"
          DEPLOY_BRANCH_PHONE="1500-P001"
          DEPLOY_ADMIN_NAME="Admin Utama"
          DEPLOY_ADMIN_EMAIL="admin@sprintlog.com"
          DEPLOY_ADMIN_PASSWORD="password"
          DEPLOY_CASHIER_NAME="Kasir DKI Jakarta"
          DEPLOY_CASHIER_EMAIL="kasir@sprintlog.com"
          DEPLOY_CASHIER_PASSWORD="password"
          DEPLOY_MANAGER_NAME="Manajer DKI Jakarta"
          DEPLOY_MANAGER_EMAIL="manager@sprintlog.com"
          DEPLOY_MANAGER_PASSWORD="password"
          DEPLOY_COURIER_NAME="Kurir Satria"
          DEPLOY_COURIER_EMAIL="kurir@sprintlog.com"
          DEPLOY_COURIER_PASSWORD="password"

    - name: Write Nginx load balancer config
      ansible.builtin.copy:
        dest: "{{ app_deploy_path }}/infra/docker/nginx-lb.conf"
        mode: "0644"
        content: |
          upstream sprintlog_app {
              server app:80;
              keepalive 32;
          }

          server {
              listen 80;
              server_name _;

              client_max_body_size 32m;

              location / {
                  proxy_pass http://sprintlog_app;
                  proxy_http_version 1.1;
                  proxy_set_header Connection "";
                  proxy_set_header Host $http_host;
                  proxy_set_header X-Forwarded-Host $http_host;
                  proxy_set_header X-Forwarded-Port 8080;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto http;
                  proxy_connect_timeout 5s;
                  proxy_send_timeout 60s;
                  proxy_read_timeout 60s;
              }
          }

    - name: Write Docker stack file
      ansible.builtin.copy:
        dest: "{{ app_deploy_path }}/infra/docker/docker-stack.yml"
        mode: "0644"
        content: |
          version: "3.8"

          x-app-env: &app-env
            APP_NAME: SprintLog
            APP_ENV: production
            APP_KEY: ${APP_KEY}
            APP_DEBUG: "false"
            APP_URL: ${APP_URL}
            APP_TIMEZONE: ${APP_TIMEZONE}
            TZ: ${TZ}
            DB_CONNECTION: mysql
            DB_HOST: db
            DB_PORT: "3306"
            DB_DATABASE: sprintlog
            DB_USERNAME: sprintlog
            DB_PASSWORD: ${DB_PASSWORD}
            SESSION_DRIVER: database
            SESSION_SECURE_COOKIE: "false"
            SESSION_SECURE: "false"
            SESSION_SAME_SITE: lax
            TRUSTED_PROXIES: "*"
            CACHE_STORE: database
            QUEUE_CONNECTION: database

          services:
            lb:
              image: ${NGINX_LB_IMAGE}
              ports:
                - "${HTTP_PORT}:80"
              configs:
                - source: nginx_lb_config
                  target: /etc/nginx/conf.d/default.conf
              networks:
                - app_net
              deploy:
                replicas: ${LB_REPLICAS}
                placement:
                  constraints:
                    - node.hostname == ${SWARM_MANAGER_HOSTNAME}
                restart_policy:
                  condition: any

            app:
              image: ${SPRINTLOG_IMAGE}
              environment: *app-env
              networks:
                - app_net
              volumes:
                - app_storage:/var/www/html/storage
              deploy:
                replicas: ${APP_REPLICAS}
                placement:
                  constraints:
                    - node.hostname == ${SWARM_MANAGER_HOSTNAME}
                restart_policy:
                  condition: any

            db:
              image: ${MYSQL_IMAGE}
              environment:
                MYSQL_DATABASE: sprintlog
                MYSQL_USER: sprintlog
                MYSQL_PASSWORD: ${DB_PASSWORD}
                MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
              networks:
                - app_net
              volumes:
                - db_data:/var/lib/mysql
              deploy:
                replicas: ${MYSQL_REPLICAS}
                placement:
                  constraints:
                    - node.hostname == ${SWARM_MANAGER_HOSTNAME}
                restart_policy:
                  condition: any

          networks:
            app_net:
              name: network_ujikom
              driver: overlay
              attachable: true

          volumes:
            db_data:
              name: db_ujikom
            app_storage:
              name: volume_ujikom

          configs:
            nginx_lb_config:
              file: ./nginx-lb.conf

    - name: Deploy Docker stack
      ansible.builtin.shell: |
        set -a
        . ./.env
        set +a
        docker stack deploy -c docker-stack.yml {{ stack_name }}
      args:
        chdir: "{{ app_deploy_path }}/infra/docker"

    - name: Show SprintLog services
      ansible.builtin.command: docker stack services {{ stack_name }}
      register: stack_services
      changed_when: false

    - name: Print SprintLog services
      ansible.builtin.debug:
        var: stack_services.stdout_lines

    - name: Wait until database service has one replica
      ansible.builtin.command: docker service ls --filter name={{ stack_name }}_db --format '{{ "{{.Replicas}}" }}'
      register: db_replicas
      changed_when: false
      retries: 20
      delay: 6
      until: db_replicas.stdout is search('1/1')

    - name: Wait until app service has three replicas
      ansible.builtin.command: docker service ls --filter name={{ stack_name }}_app --format '{{ "{{.Replicas}}" }}'
      register: app_replicas_result
      changed_when: false
      retries: 20
      delay: 6
      until: app_replicas_result.stdout is search('3/3')

    - name: Run Laravel migration, storage link, and optimize
      ansible.builtin.shell: |
        docker run --rm \
          --network {{ docker_network_name }} \
          --env-file ./.env \
          -v {{ docker_storage_volume_name }}:/var/www/html/storage \
          {{ sprintlog_image }} \
          sh -lc 'php artisan migrate --force && (php artisan storage:link || true) && php artisan optimize'
      args:
        chdir: "{{ app_deploy_path }}/infra/docker"
      register: laravel_bootstrap
      retries: 10
      delay: 15
      until: laravel_bootstrap.rc == 0

    - name: Print Laravel bootstrap output
      ansible.builtin.debug:
        var: laravel_bootstrap.stdout_lines

    - name: Seed full demo data
      ansible.builtin.shell: |
        docker run --rm \
          --network {{ docker_network_name }} \
          --env-file ./.env \
          {{ sprintlog_image }} \
          php artisan db:seed --force
      args:
        chdir: "{{ app_deploy_path }}/infra/docker"
      when: database_seed_mode == "demo"

  handlers:
    - name: Restart docker
      ansible.builtin.service:
        name: docker
        state: restarted
