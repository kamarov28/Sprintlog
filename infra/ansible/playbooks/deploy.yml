---
- name: Deploy SprintLog stack from VM 1
  hosts: swarm_manager
  become: true
  vars_files:
    - ../group_vars/all.yml
  tags:
    - deploy
  tasks:
    - name: Clone or update SprintLog repository from VCS
      ansible.builtin.git:
        repo: "{{ app_repo_url }}"
        dest: "{{ app_deploy_path }}"
        version: "{{ app_repo_version }}"
        update: "{{ app_repo_update | default(true) | bool }}"

    - name: Build SprintLog image from the single Dockerfile
      ansible.builtin.command: docker build --network=host -t {{ sprintlog_image }} -f Dockerfile .
      args:
        chdir: "{{ app_deploy_path }}"

    - name: Push SprintLog image to VM 1 local registry
      ansible.builtin.command: docker push {{ sprintlog_image }}

    - name: Decide whether APP_KEY must be generated
      ansible.builtin.set_fact:
        sprintlog_generate_app_key: "{{ (app_key | default('') | trim) == '' or 'CHANGE_THIS' in (app_key | default('')) }}"

    - name: Generate Laravel APP_KEY automatically for lab deployment
      ansible.builtin.shell: "printf 'base64:%s\n' \"$(openssl rand -base64 32)\""
      register: generated_app_key
      changed_when: sprintlog_generate_app_key | bool
      when: sprintlog_generate_app_key | bool

    - name: Set runtime Laravel APP_KEY
      ansible.builtin.set_fact:
        sprintlog_runtime_app_key: "{{ generated_app_key.stdout if (sprintlog_generate_app_key | bool) else app_key }}"

    - name: Write stack environment file
      ansible.builtin.template:
        src: ../templates/stack.env.j2
        dest: "{{ app_deploy_path }}/infra/docker/.env"
        mode: "0600"

    - name: Render Docker stack file from Ansible variables
      ansible.builtin.template:
        src: ../templates/docker-stack.two-vm.yml.j2
        dest: "{{ app_deploy_path }}/infra/docker/docker-stack.two-vm.yml"
        mode: "0644"

    - name: Render Nginx load balancer config from Ansible variables
      ansible.builtin.template:
        src: ../templates/nginx-lb.conf.j2
        dest: "{{ app_deploy_path }}/infra/docker/nginx-lb.conf"
        mode: "0644"

    - name: Deploy Docker stack with configurable resource names
      ansible.builtin.shell: |
        set -a
        . ./.env
        set +a
        export DOCKER_NETWORK_NAME='{{ docker_network_name }}'
        export DOCKER_DB_VOLUME_NAME='{{ docker_db_volume_name }}'
        export DOCKER_STORAGE_VOLUME_NAME='{{ docker_storage_volume_name }}'
        docker stack deploy -c docker-stack.two-vm.yml {{ stack_name }}
      args:
        chdir: "{{ app_deploy_path }}/infra/docker"

    - name: Show SprintLog services
      ansible.builtin.command: docker stack services {{ stack_name }}
      register: stack_services
      changed_when: false

    - name: Print SprintLog services
      ansible.builtin.debug:
        var: stack_services.stdout_lines

    - name: Wait until database service has one replica
      ansible.builtin.command: docker service ls --filter name={{ stack_name }}_{{ db_service_name }} --format '{{ "{{.Replicas}}" }}'
      register: db_replicas
      changed_when: false
      retries: 20
      delay: 6
      until: "'{{ mysql_replicas }}/{{ mysql_replicas }}' in db_replicas.stdout"

    - name: Wait until app service has requested replicas
      ansible.builtin.command: docker service ls --filter name={{ stack_name }}_{{ app_service_name }} --format '{{ "{{.Replicas}}" }}'
      register: app_replicas_result
      changed_when: false
      retries: 20
      delay: 6
      until: "'{{ app_replicas }}/{{ app_replicas }}' in app_replicas_result.stdout"

    - name: Run Laravel migration, storage link, and optimize automatically
      ansible.builtin.shell: |
        docker run --rm \
          --network {{ docker_network_name }} \
          --env-file ./.env \
          -v {{ docker_storage_volume_name }}:/var/www/html/storage \
          {{ sprintlog_image }} \
          sh -lc 'php artisan migrate --force && (php artisan storage:link || true) && php artisan optimize'
      args:
        chdir: "{{ app_deploy_path }}/infra/docker"
      register: laravel_bootstrap
      retries: 10
      delay: 15
      until: laravel_bootstrap.rc == 0

    - name: Print Laravel bootstrap output
      ansible.builtin.debug:
        var: laravel_bootstrap.stdout_lines

    - name: Seed deploy login accounts when enabled
      ansible.builtin.shell: |
        docker run --rm \
          --network {{ docker_network_name }} \
          --env-file ./.env \
          {{ sprintlog_image }} \
          php artisan db:seed --class=Database\\Seeders\\DeploymentAccountSeeder --force
      args:
        chdir: "{{ app_deploy_path }}/infra/docker"
      when: database_seed_mode == "accounts"

    - name: Seed full demo data when enabled
      ansible.builtin.shell: |
        docker run --rm \
          --network {{ docker_network_name }} \
          --env-file ./.env \
          {{ sprintlog_image }} \
          php artisan db:seed --force
      args:
        chdir: "{{ app_deploy_path }}/infra/docker"
      when: database_seed_mode == "demo"
