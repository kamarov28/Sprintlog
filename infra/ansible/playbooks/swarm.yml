---
- name: Initialize Docker Swarm on VM 1
  hosts: swarm_manager
  become: true
  vars_files:
    - ../group_vars/all.yml
  tags:
    - swarm
    - registry
  tasks:
    - name: Check current Swarm state
      ansible.builtin.command: docker info --format '{{ "{{.Swarm.LocalNodeState}}" }}'
      register: swarm_state
      changed_when: false

    - name: Initialize Swarm manager
      ansible.builtin.command: docker swarm init --advertise-addr {{ swarm_advertise_addr }}
      when: swarm_state.stdout != "active"

    - name: Check local Docker registry container
      ansible.builtin.command: docker inspect -f '{{ "{{.State.Running}}" }}' {{ docker_registry_container_name }}
      register: registry_state
      failed_when: false
      changed_when: false

    - name: Start existing local Docker registry container
      ansible.builtin.command: docker start {{ docker_registry_container_name }}
      when:
        - registry_state.rc == 0
        - registry_state.stdout != "true"

    - name: Create local Docker registry on VM 1
      ansible.builtin.command: >
        docker run -d --restart=always
        -p {{ docker_registry_port }}:5000
        -v {{ docker_registry_volume_name }}:/var/lib/registry
        --name {{ docker_registry_container_name }} {{ docker_registry_image }}
      when: registry_state.rc != 0

    - name: Wait until local registry responds
      ansible.builtin.uri:
        url: "http://{{ docker_registry_host }}/v2/"
        status_code: 200
      register: registry_health
      retries: 10
      delay: 3
      until: registry_health.status == 200
