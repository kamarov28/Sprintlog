---
- name: Install Docker on both VMs
  hosts: docker_hosts
  become: true
  vars_files:
    - ../group_vars/all.yml
  tags:
    - docker
  tasks:
    - name: Ensure Docker config directory exists
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        mode: "0755"

    - name: Configure Docker daemon for VM 1 local registry
      ansible.builtin.template:
        src: ../templates/docker-daemon.json.j2
        dest: /etc/docker/daemon.json
        mode: "0644"
      notify: Restart docker

    - name: Install Docker engine packages
      ansible.builtin.apt:
        name: "{{ docker_engine_packages }}"
        update_cache: true
        state: present

    - name: Try installing Docker Compose v2 plugin
      ansible.builtin.apt:
        name: "{{ docker_compose_v2_package }}"
        state: present
      register: docker_compose_v2_result
      ignore_errors: true

    - name: Install legacy Docker Compose when v2 package is unavailable
      ansible.builtin.apt:
        name: "{{ docker_compose_fallback_package }}"
        state: present
      when: docker_compose_v2_result is failed

    - name: Enable Docker
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started

    - name: Add SSH user to docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true
      when: ansible_user is defined

  handlers:
    - name: Restart docker
      ansible.builtin.service:
        name: docker
        state: restarted
