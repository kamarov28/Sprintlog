---
- name: Prepare Ubuntu base packages on both VMs
  hosts: all
  become: true
  vars_files:
    - ../group_vars/all.yml
  tags:
    - base
  tasks:
    - name: Install base packages
      ansible.builtin.apt:
        name: "{{ base_packages }}"
        update_cache: true
        state: present

    - name: Ensure SSH service is enabled
      ansible.builtin.service:
        name: ssh
        enabled: true
        state: started

    - name: Add lab host records
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} SPRINTLOG LAB HOSTS"
        block: |
          {{ controller_ip }} {{ lab_domain }} www.{{ lab_domain }} admin.{{ lab_domain }} controller.{{ lab_domain }} vm1
          {{ managed_ip }} vm2 app2.{{ lab_domain }}
