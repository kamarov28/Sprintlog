---
- name: Prepare Ubuntu base packages on VM1
  hosts: all
  become: true
  vars_files:
    - ../group_vars/all.yml
  tags:
    - base
  tasks:
    - name: Install base packages
      ansible.builtin.apt:
        name: "{{ base_packages }}"
        update_cache: true
        state: present

    - name: Ensure SSH service is enabled
      ansible.builtin.service:
        name: ssh
        enabled: true
        state: started

    - name: Add VM1 host record
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} SPRINTLOG LAB HOSTS"
        block: |
          {{ controller_ip }} vm1
