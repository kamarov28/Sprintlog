version: "3.8"

x-app-env: &app-env
  APP_NAME: SprintLog
  APP_ENV: production
  APP_KEY: ${APP_KEY}
  APP_DEBUG: "false"
  APP_URL: ${APP_URL:-https://sprintlog.local}
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: "3306"
  DB_DATABASE: sprintlog
  DB_USERNAME: sprintlog
  DB_PASSWORD: ${DB_PASSWORD}
  SESSION_DRIVER: database
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
  SESSION_SECURE: ${SESSION_SECURE:-true}
  SESSION_SAME_SITE: ${SESSION_SAME_SITE:-lax}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
  CACHE_STORE: database
  QUEUE_CONNECTION: database
  MAIL_MAILER: smtp
  MAIL_HOST: ${MAIL_HOST:-mail.sprintlog.local}
  MAIL_PORT: ${MAIL_PORT:-25}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@sprintlog.local}
  MAIL_FROM_NAME: SprintLog

services:
  lb:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    configs:
      - source: nginx_lb_config
        target: /etc/nginx/conf.d/default.conf
    volumes:
      - ${TLS_CERT_DIR:-/opt/sprintlog/infra/docker/certs}:/etc/nginx/certs:ro
    networks:
      - sprintlog_net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

  app:
    image: ${SPRINTLOG_IMAGE:-USERNAME/sprintlog-apache:latest}
    environment: *app-env
    networks:
      - sprintlog_net
    volumes:
      - sprintlog_storage:/var/www/html/storage
    deploy:
      replicas: 2
      placement:
        max_replicas_per_node: 1
      restart_policy:
        condition: any

  worker:
    image: ${SPRINTLOG_IMAGE:-USERNAME/sprintlog-apache:latest}
    command: php artisan queue:work database --sleep=3 --tries=3 --max-time=3600
    environment: *app-env
    networks:
      - sprintlog_net
    volumes:
      - sprintlog_storage:/var/www/html/storage
    deploy:
      replicas: 0
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: sprintlog
      MYSQL_USER: sprintlog
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    networks:
      - sprintlog_net
    volumes:
      - sprintlog_db:/var/lib/mysql
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == ${SWARM_MANAGER_HOSTNAME:-vm1}
      restart_policy:
        condition: any

networks:
  sprintlog_net:
    driver: overlay
    attachable: true

volumes:
  sprintlog_db:
  sprintlog_storage:

configs:
  nginx_lb_config:
    file: ./nginx-lb.conf
