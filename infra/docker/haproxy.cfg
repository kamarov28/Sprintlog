global
    log stdout format raw local0

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 50s
    timeout server 50s

frontend http_in
    bind *:80
    default_backend sprintlog_app

backend sprintlog_app
    balance roundrobin
    option httpchk GET /
    http-check expect status 200-399
    server-template app 4 tasks.app:80 check resolvers docker init-addr libc,none

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
