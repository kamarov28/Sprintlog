version: "3.8"

services:
  phpmyadmin:
    image: phpmyadmin:5.2-apache
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "8080:80"
    networks:
      - sprintlog_net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

networks:
  sprintlog_net:
    external: true
    name: sprintlog_sprintlog_net
